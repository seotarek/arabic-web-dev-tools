<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic Web Dev Tools | أدوات المطور العربي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="text-center mb-10">
      <h1 class="text-3xl font-bold text-emerald-400 mb-2">أدوات المطور العربي (Arabic Web Dev Tools)</h1>
      <p class="text-slate-400">مجموعة أدوات فورية تعمل بالكامل داخل المتصفح بدون إعلانات وبأعلى خصوصية</p>
    </header>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Tashkeel Stripper -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-xl font-semibold mb-3 text-amber-300">1. إزالة التشكيل وتوحيد الحروف</h2>
        <textarea id="tashkeelInput" class="w-full h-28 bg-slate-950 p-3 rounded border border-slate-700 text-sm mb-3 focus:outline-none focus:border-amber-400" placeholder="اكتب أو الصق نصاً مشكولاً هنا..."></textarea>
        <button onclick="handleTashkeel()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-4 rounded transition">تنظيف النص فورا</button>
      </div>

      <!-- Keyboard Fixer -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-xl font-semibold mb-3 text-cyan-300">2. تصحيح لغة لوحة المفاتيح المعكوسة</h2>
        <textarea id="kbInput" class="w-full h-28 bg-slate-950 p-3 rounded border border-slate-700 text-sm mb-3 focus:outline-none focus:border-cyan-400" placeholder="اكتب نصاً كُتب بالخطأ بحروف إنجليزية مثل lvpfn..."></textarea>
        <button onclick="handleKeyboard()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-2 px-4 rounded transition">تصحيح لوحة المفاتيح</button>
      </div>

      <!-- RTL CSS Flipper -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 md:col-span-2">
        <h2 class="text-xl font-semibold mb-3 text-emerald-300">3. تحويل CSS & Tailwind إلى RTL</h2>
        <div class="grid md:grid-cols-2 gap-4 mb-3">
          <textarea id="cssInput" class="w-full h-36 bg-slate-950 p-3 rounded border border-slate-700 text-sm font-mono text-left focus:outline-none focus:border-emerald-400" placeholder=".header { margin-left: 15px; float: left; }"></textarea>
          <textarea id="cssOutput" readonly class="w-full h-36 bg-slate-950 p-3 rounded border border-slate-700 text-sm font-mono text-left text-emerald-400" placeholder="النتيجة بعد التحويل إلى RTL..."></textarea>
        </div>
        <button onclick="handleRtl()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-4 rounded transition">تحويل إلى RTL</button>
      </div>
    </div>

    <footer class="mt-12 text-center text-slate-500 text-sm">
      مشروع مفتوح المصدر تم تطويره بواسطة <a href="https://tarek-mohamed.me.eg/" class="text-emerald-400 hover:underline">م. طارق محمد</a> | <a href="https://github.com/seotarek/arabic-web-dev-tools" class="underline">GitHub Repository</a>
    </footer>
  </div>

  <script type="module">
    import { stripTashkeel, fixKeyboardTypo, convertToRtlCss } from '../src/index.js';
    window.handleTashkeel = () => {
      const el = document.getElementById('tashkeelInput');
      el.value = stripTashkeel(el.value);
    };
    window.handleKeyboard = () => {
      const el = document.getElementById('kbInput');
      el.value = fixKeyboardTypo(el.value);
    };
    window.handleRtl = () => {
      const inp = document.getElementById('cssInput').value;
      document.getElementById('cssOutput').value = convertToRtlCss(inp);
    };
  </script>
</body>
</html>
